<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1040" height="560" fill="#fbfaf7"/>
  <text x="24" y="38" font-size="22" font-weight="bold" fill="#182a38">How the power path plugs into the general layout</text>
  <text x="24" y="62" font-size="13" fill="#555">Each stage of layout.ts, what PR #7 did there on its own (red), and what the redo does (green).</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#182a38"/></marker>
  </defs>

  <!-- pipeline boxes -->
  <g font-size="13" fill="#182a38">
    <rect x="24"  y="90" width="150" height="64" rx="6" fill="#e8eef3" stroke="#182a38"/>
    <text x="99"  y="116" text-anchor="middle" font-weight="bold">1 Classify</text>
    <text x="99"  y="136" text-anchor="middle" font-size="11">power-path.ts</text>

    <rect x="196" y="90" width="150" height="64" rx="6" fill="#e8eef3" stroke="#182a38"/>
    <text x="271" y="116" text-anchor="middle" font-weight="bold">2 Decoupling</text>
    <text x="271" y="136" text-anchor="middle" font-size="11">top slots of power_in pins</text>

    <rect x="368" y="90" width="150" height="64" rx="6" fill="#e8eef3" stroke="#182a38"/>
    <text x="443" y="116" text-anchor="middle" font-weight="bold">3 Pick loads</text>
    <text x="443" y="136" text-anchor="middle" font-size="11">pathAnchors, before flow</text>

    <rect x="540" y="90" width="150" height="64" rx="6" fill="#e8eef3" stroke="#182a38"/>
    <text x="615" y="116" text-anchor="middle" font-weight="bold">4 Pin sides</text>
    <text x="615" y="136" text-anchor="middle" font-size="11">icFor</text>

    <rect x="712" y="90" width="150" height="64" rx="6" fill="#e8eef3" stroke="#182a38"/>
    <text x="787" y="116" text-anchor="middle" font-weight="bold">5 Place</text>
    <text x="787" y="136" text-anchor="middle" font-size="11">flow, tucking, standBeside</text>

    <rect x="884" y="90" width="132" height="64" rx="6" fill="#e8eef3" stroke="#182a38"/>
    <text x="950" y="116" text-anchor="middle" font-weight="bold">6 Route</text>
    <text x="950" y="136" text-anchor="middle" font-size="11">router.ts, seal</text>
  </g>
  <g stroke="#182a38" stroke-width="1.5" marker-end="url(#a)">
    <line x1="174" y1="122" x2="194" y2="122"/><line x1="346" y1="122" x2="366" y2="122"/>
    <line x1="518" y1="122" x2="538" y2="122"/><line x1="690" y1="122" x2="710" y2="122"/>
    <line x1="862" y1="122" x2="882" y2="122"/>
  </g>

  <!-- PR #7 alone -->
  <text x="24" y="190" font-size="14" font-weight="bold" fill="#b03a2e">PR #7 alone</text>
  <g font-size="12" fill="#b03a2e">
    <text x="24" y="212">An ESP32 board (power_in</text>
    <text x="24" y="228">and power_out pins) was</text>
    <text x="24" y="244">taken for a regulator.</text>

    <text x="196" y="212">(My first try.) Input caps</text>
    <text x="196" y="228">lost their slot when IN moved</text>
    <text x="196" y="244">to the side; a row of two cannot</text>
    <text x="196" y="260">stay within the 8 G reach (C13).</text>

    <text x="368" y="212">No step: the load a path</text>
    <text x="368" y="228">pin joined was whichever</text>
    <text x="368" y="244">symbol the router reached</text>
    <text x="368" y="260">first, after placement.</text>

    <text x="540" y="212">Pins kept the default sides,</text>
    <text x="540" y="228">so OUT could face left.</text>

    <text x="712" y="212">A regulator with only supply</text>
    <text x="712" y="228">pins was "port-only" and got</text>
    <text x="712" y="244">tucked into the far column.</text>

    <text x="884" y="212">Path wires ran to symbols</text>
    <text x="884" y="228">across the sheet: long</text>
    <text x="884" y="244">wires, extra bends.</text>
  </g>

  <!-- Now -->
  <text x="24" y="304" font-size="14" font-weight="bold" fill="#2e7d4f">Now</text>
  <g font-size="12" fill="#2e7d4f">
    <text x="24" y="326">A part with connected</text>
    <text x="24" y="342">signal pins is not a</text>
    <text x="24" y="358">regulator.</text>

    <text x="196" y="326">A pin with decoupling caps</text>
    <text x="196" y="342">keeps its top slots and its</text>
    <text x="196" y="358">symbol; only an undecoupled</text>
    <text x="196" y="374">pin goes on the side.</text>

    <text x="368" y="326">Every cap to ground on the</text>
    <text x="368" y="342">pin's net, smallest first; or</text>
    <text x="368" y="358">one other two-pin load. They</text>
    <text x="368" y="374">ride with the regulator.</text>

    <text x="540" y="326">IN on the left, OUT on the</text>
    <text x="540" y="342">right. A pin with no load</text>
    <text x="540" y="358">beside it keeps its symbol.</text>

    <text x="712" y="326">The loads stand in a row</text>
    <text x="712" y="342">beside the pin as rigid</text>
    <text x="712" y="358">children; untouched ones</text>
    <text x="712" y="374">hold their place in an edit.</text>

    <text x="884" y="326">Path pins join a load's</text>
    <text x="884" y="342">supply stub, never a</text>
    <text x="884" y="358">symbol (seal points).</text>
  </g>

  <!-- mini regulator sketch -->
  <g transform="translate(300,410)" stroke="#182a38" stroke-width="2" fill="none">
    <text x="-276" y="20" font-size="14" font-weight="bold" fill="#182a38" stroke="none">Result</text>
    <text x="-276" y="40" font-size="12" fill="#555" stroke="none">bench/regulator, after</text>
    <!-- VIN symbol and input caps on top -->
    <line x1="60" y1="10" x2="60" y2="60"/>
    <line x1="48" y1="10" x2="72" y2="10"/>
    <text x="60" y="4" font-size="11" text-anchor="middle" fill="#182a38" stroke="none">VIN</text>
    <line x1="60" y1="24" x2="90" y2="24"/>
    <line x1="90" y1="24" x2="90" y2="34"/>
    <line x1="82" y1="34" x2="98" y2="34"/><line x1="82" y1="40" x2="98" y2="40"/>
    <line x1="90" y1="40" x2="90" y2="50"/>
    <text x="104" y="40" font-size="11" fill="#2e7d4f" stroke="none">input caps in top slots</text>
    <!-- regulator box -->
    <rect x="30" y="60" width="80" height="50"/>
    <text x="70" y="78" font-size="11" text-anchor="middle" fill="#182a38" stroke="none">IN</text>
    <text x="95" y="92" font-size="11" text-anchor="middle" fill="#182a38" stroke="none">OUT</text>
    <!-- output row -->
    <line x1="110" y1="88" x2="230" y2="88"/>
    <circle cx="160" cy="88" r="3" fill="#182a38"/><circle cx="220" cy="88" r="3" fill="#182a38"/>
    <line x1="160" y1="88" x2="160" y2="100"/>
    <line x1="152" y1="100" x2="168" y2="100"/><line x1="152" y1="106" x2="168" y2="106"/>
    <line x1="160" y1="106" x2="160" y2="120"/>
    <line x1="220" y1="60" x2="220" y2="100"/>
    <line x1="208" y1="60" x2="232" y2="60"/>
    <text x="220" y="54" font-size="11" text-anchor="middle" fill="#182a38" stroke="none">5V</text>
    <line x1="212" y1="100" x2="228" y2="100"/><line x1="212" y1="106" x2="228" y2="106"/>
    <line x1="220" y1="106" x2="220" y2="120"/>
    <text x="250" y="92" font-size="11" fill="#2e7d4f" stroke="none">OUT wired straight into a row: 100 nF nearest,</text>
    <text x="250" y="108" font-size="11" fill="#2e7d4f" stroke="none">10 uF outermost with the one 5V symbol on its stub</text>
  </g>
</svg>
