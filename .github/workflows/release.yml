# Publish the npm package. DISABLED BY DEFAULT.
#
# It never runs on its own: the only trigger is a manual "Run workflow" in the Actions tab
# (workflow_dispatch). To release:
#   1. Settle the npm name (the name "schem" on npm belongs to someone else today; see
#      docs/agent-reports/claude-npm-package.md) and set "version" in package.json.
#   2. Add the repository secret NPM_TOKEN (an npm automation token with publish rights).
#   3. Push a tag v<version>, for example v0.1.0, that points at the release commit.
#   4. Actions, release, Run workflow, choose that tag under "Use workflow from". Leave
#      "publish" unticked first: the run checks everything and does `npm publish --dry-run`.
#      Run it again with "publish" ticked to publish for real.
# To run it on every version tag instead, add under "on:":
#     push:
#       tags: ["v*"]
# and change the two "if:" lines below so that a tag push publishes (a push has no inputs, so
# as written it would only do the dry run). Do that only once the steps above are settled.
name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm (unticked: check everything and do a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run phase0
      - run: npm run pack:smoke

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance: signs where and how the package was built
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: The tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "Run this workflow from the tag v$version (it ran from $GITHUB_REF)." >&2
            exit 1
          fi
      - name: Dry run
        if: ${{ !inputs.publish }}
        run: npm publish --dry-run --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish
        if: ${{ inputs.publish }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
