# Publish the playground (web/, built into out/web/) to GitHub Pages on every push to main.
# Skipped while the repository is private: Pages for a private repository needs a paid plan, and
# the playground goes live with the public launch. Enable Pages with "GitHub Actions" as the
# source in the repository settings first.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/web
      - id: deployment
        uses: actions/deploy-pages@v4
